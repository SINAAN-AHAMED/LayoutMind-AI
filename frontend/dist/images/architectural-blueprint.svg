<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-label="Minimal architectural floor plan">
<title>One-bedroom apartment with a central entrance hall</title>
<desc>Eight-metre-square apartment. The front door opens into a dedicated central foyer and hall. A wide west opening leads directly into the living room. The kitchen is a separate room at the far north-west end of the hall, behind its own door. Bedroom and bathroom have separate east hall doors. Windows occupy real exterior wall openings. Furniture and door swings remain clear of the arrival route.</desc>
