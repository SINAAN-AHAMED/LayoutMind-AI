<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LayoutMind</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 300 400;
      font-display: swap;
      src: url('fonts/Inter-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 600 700;
      font-display: swap;
      src: url('fonts/Inter-Bold.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 480px; height: 320px;
      background: linear-gradient(135deg, #0d0d22 0%, #111130 60%, #0a0a1e 100%);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(99, 102, 241, 0.15),
        0 0 120px rgba(139, 92, 246, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.06);
      -webkit-app-region: drag;
    }

    /* Animated background glow */
    .card::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
      top: -80px; left: -60px;
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite;
    }
    .card::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 70%);
      bottom: -60px; right: -40px;
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite reverse;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }

    /* Logo icon */
    .logo {
      width: 64px; height: 64px;
      position: relative;
      z-index: 1;
      animation: logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .logo svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 12px rgba(99,102,241,0.7));
    }

    /* Brand block — title + subtitle stacked cleanly */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e2e8ff 0%, #a5b4fc 50%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin: 0;
    }

    .subtitle {
      font-size: 10px;
      font-weight: 400;
      color: rgba(165, 180, 252, 0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
      margin: 0;
    }

    /* Loading bar */
    .loader-wrap {
      width: 200px;
      position: relative; z-index: 1;
      margin-top: 8px;
    }
    .loader-track {
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
      animation: load 2.5s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(99,102,241,0.8);
    }
    @keyframes load {
      0% { width: 0%; margin-left: 0; }
      50% { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .status {
      font-size: 11px;
      color: rgba(165, 180, 252, 0.4);
      letter-spacing: 0.5px;
      position: relative; z-index: 1;
      margin-top: -8px;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Geometric room + brain wireframe logo -->
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Room wireframe -->
        <polygon points="32,6 58,20 58,44 32,58 6,44 6,20" stroke="rgba(99,102,241,0.6)" stroke-width="1.2" fill="none"/>
        <polygon points="32,16 48,25 48,43 32,52 16,43 16,25" stroke="rgba(139,92,246,0.5)" stroke-width="1" fill="none"/>
        <!-- Neural nodes -->
        <circle cx="32" cy="6"  r="2.5" fill="#6366f1"/>
        <circle cx="58" cy="20" r="2.5" fill="#6366f1"/>
        <circle cx="58" cy="44" r="2.5" fill="#8b5cf6"/>
        <circle cx="32" cy="58" r="2.5" fill="#8b5cf6"/>
        <circle cx="6"  cy="44" r="2.5" fill="#8b5cf6"/>
        <circle cx="6"  cy="20" r="2.5" fill="#6366f1"/>
        <!-- Center node -->
        <circle cx="32" cy="32" r="4" fill="rgba(99,102,241,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
        <!-- Neural connections -->
        <line x1="32" y1="6"  x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <line x1="58" y1="20" x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <line x1="58" y1="44" x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <line x1="32" y1="58" x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <line x1="6"  y1="44" x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <line x1="6"  y1="20" x2="32" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
      </svg>
    </div>

    <div class="brand">
      <div class="title">LayoutMind</div>
      <div class="subtitle">AI Interior Studio</div>
    </div>

    <div class="loader-wrap">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>

    <div class="status">Starting AI engine…</div>
  </div>
</body>
</html>
